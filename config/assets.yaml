    domain: integrated
    layer: serving
    description: >-
      面向看板与报表的服务层资产：由逐小时融合宽表按城市×自然日聚合，输出
      日均/极值气象指标、AQI 均值与峰值、优良天数标志、超标小时数等考核口径。
    business_definition: 城市 × 自然日粒度的一条环境质量考核记录。
    owner: 数据平台组
    steward: 指标体系管理员
    source_system: 平台内部生产（ETL）
    source_product: city_environment_daily 作业
    source_endpoint: internal://jobs/city_environment_daily
    source_doc: docs/ARCHITECTURE.md
    license: CC-BY-4.0
    granularity: daily
    update_frequency: daily
    sla_freshness_minutes: 720
    sla_completeness: 0.93
    sensitivity: public
    status: active
    tags: [服务层, 日汇总, 考核口径, 看板数据源]
    primary_key: [city_id, date]
    time_column: date
    partition_keys: [city_id, year, month]
    columns:
      - {name: city_id, type: string, unit: "-", nullable: false, pk: true, desc: 城市标识}
      - {name: date, type: date, unit: iso8601, nullable: false, pk: true, desc: 数据日期}
      - {name: temp_avg, type: double, unit: °C, nullable: true, range: [-90, 70], desc: 日均气温}
      - {name: temp_max, type: double, unit: °C, nullable: true, range: [-90, 70], desc: 日最高气温}
      - {name: temp_min, type: double, unit: °C, nullable: true, range: [-90, 70], desc: 日最低气温}
      - {name: humidity_avg, type: double, unit: "%", nullable: true, range: [0, 100], desc: 日均相对湿度}
      - {name: precipitation_sum, type: double, unit: mm, nullable: true, range: [0, 2000], desc: 日累计降水量}
      - {name: wind_speed_avg, type: double, unit: km/h, nullable: true, range: [0, 400], desc: 日均风速}
      - {name: pressure_avg, type: double, unit: hPa, nullable: true, range: [850, 1100], desc: 日均海平面气压}
      - {name: aqi_avg, type: double, unit: EAQI, nullable: true, range: [0, 500], desc: 日均欧洲空气质量指数}
      - {name: aqi_max, type: double, unit: EAQI, nullable: true, range: [0, 500], desc: 日峰值欧洲空气质量指数}
      - {name: china_aqi, type: double, unit: AQI, nullable: true, range: [0, 500], desc: "国标日 AQI（依据当日 24 小时平均浓度计算，HJ 633-2012 规定方法，与官方考核口径可比）"}
      - {name: china_aqi_level, type: string, unit: "-", nullable: true, enum: [优, 良, 轻度污染, 中度污染, 重度污染, 严重污染], desc: 国标日 AQI 对应等级}
      - {name: china_primary_pollutant, type: string, unit: "-", nullable: true, enum: [PM2.5, PM10, O₃, NO₂, SO₂, CO, 无], desc: 国标口径首要污染物}
      - {name: pm2_5_avg, type: double, unit: μg/m³, nullable: true, range: [0, 2000], desc: 日均 PM2.5 浓度（国标日 AQI 的输入）}
      - {name: pm10_avg, type: double, unit: μg/m³, nullable: true, range: [0, 3000], desc: 日均 PM10 浓度（国标日 AQI 的输入）}
      - {name: ozone_8h_max, type: double, unit: μg/m³, nullable: true, range: [0, 1000], desc: 日最大 8 小时滑动平均臭氧浓度（国标日 AQI 的输入）}
      - {name: nitrogen_dioxide_avg, type: double, unit: μg/m³, nullable: true, range: [0, 2000], desc: 日均二氧化氮浓度}
      - {name: sulphur_dioxide_avg, type: double, unit: μg/m³, nullable: true, range: [0, 3000], desc: 日均二氧化硫浓度}
      - {name: carbon_monoxide_avg, type: double, unit: μg/m³, nullable: true, range: [0, 60000], desc: 日均一氧化碳浓度}
      - {name: dominant_aqi_level, type: string, unit: "-", nullable: true, enum: [优, 良, 轻度污染, 中度污染, 重度污染, 严重污染], desc: 当日主导空气质量等级（按欧洲 AQI 峰值判定）}
      - {name: good_air_day, type: integer, unit: "0/1", nullable: true, enum: [0, 1], desc: "是否空气质量优良日（国标日 AQI ≤ 100）"}
      - {name: exceed_hours, type: integer, unit: h, nullable: true, range: [0, 24], desc: "空气质量超标小时数（欧洲 AQI > 40，用于小时级过程识别）"}
      - {name: stagnant_hours, type: integer, unit: h, nullable: true, range: [0, 24], desc: 静稳天气小时数}
      - {name: obs_hours, type: integer, unit: h, nullable: true, range: [0, 24], desc: 实际有效观测小时数（质量口径）}
      - {name: ingested_at, type: timestamp, unit: iso8601, nullable: true, desc: 平台入库时间}
      - {name: source_run_id, type: string, unit: "-", nullable: true, desc: 采集批次标识}


# ============================================================
# 血缘关系（上游 → 下游）
# bootstrap 时写入 lineage_edges，并与作业实现保持一致。
# transform_type: derive | join | aggregate | enrich | reference
# ============================================================
lineage:
  - upstream: openmeteo.geocoding.places
    downstream: openmeteo.weather.forecast.hourly
    transform_type: reference
    transform_ref: collect_weather_forecast
    description: 以城市主数据解析出的 WGS84 坐标与时区作为 API 请求参数，确定数据点的空间与时间口径。

  - upstream: openmeteo.geocoding.places
    downstream: openmeteo.air_quality.hourly
    transform_type: reference
    transform_ref: collect_air_quality
    description: 复用城市主数据坐标与时区，保证空气质量与气象数据在同一空间点位上可比。

  - upstream: openmeteo.geocoding.places
    downstream: openmeteo.weather.forecast.daily
    transform_type: reference
    transform_ref: collect_weather_daily
    description: 逐日资产同样以城市主数据解析出的 WGS84 坐标与时区作为请求参数，保证与逐小时资产空间口径一致。

  - upstream: openmeteo.geocoding.places
    downstream: openmeteo.weather.archive.hourly
    transform_type: reference
    transform_ref: collect_weather_archive
    description: 历史归档同样以城市主数据坐标为准，确保与实时资产口径一致。

  - upstream: openmeteo.weather.forecast.hourly
    downstream: atmos.city_environment.hourly
    transform_type: join
    transform_ref: build_city_environment_hourly
    description: 以 (city_id, time) 为键与空气质量数据做全外连接，形成气象要素列组；两侧任一存在记录即保留。

  - upstream: openmeteo.air_quality.hourly
    downstream: atmos.city_environment.hourly
    transform_type: join
    transform_ref: build_city_environment_hourly
    description: 以 (city_id, time) 为键与天气数据做全外连接，形成污染物与 AQI 列组；并派生空气质量等级与首要污染物。

  - upstream: openmeteo.weather.archive.hourly
    downstream: atmos.city_environment.hourly
    transform_type: enrich
    transform_ref: build_city_environment_hourly
    description: >-
      作为历史气象来源补齐天气预报覆盖不到的时段（预报仅 9 天，空气质量可回溯 92 天）。
      同一时刻以预报侧为准、归档侧兜底，否则融合宽表在历史上会有九成以上行缺失风速与降水。

  - upstream: atmos.city_environment.hourly
    downstream: atmos.city_environment.daily
    transform_type: aggregate
    transform_ref: build_city_environment_daily
    description: 按 (city_id, 自然日) 聚合均值/极值，派生优良天、超标小时数与静稳小时数等考核口径。
