  # ----------------------------------------------------------
  # 6. 精炼层：城市环境融合宽表（天气 ⨝ 空气质量）
  # ----------------------------------------------------------
  - key: atmos.city_environment.hourly
    name: 城市环境融合宽表（逐小时）
    domain: integrated
    layer: refined
    description: >-
      平台自建的衍生资产：以 (city_id, time) 为键，将逐小时天气与逐小时空气
      质量左连接融合为统一分析口径，并派生空气质量等级、人体舒适度指数、
      静稳指数与首要污染物等业务指标。气象列以预报资产为主、ERA5 归档兜底，
      从而覆盖空气质量可达的完整历史窗口。是看板与对外服务的推荐入口。
    business_definition: 城市 × 整点小时粒度的一条"气象+空气质量"联合环境记录。
    owner: 数据平台组
    steward: 指标体系管理员
    source_system: 平台内部生产（ETL）
    source_product: city_environment_hourly 作业
    source_endpoint: internal://jobs/city_environment_hourly
    source_doc: docs/ARCHITECTURE.md
    license: CC-BY-4.0
    granularity: hourly
    update_frequency: hourly
    sla_freshness_minutes: 240
    sla_completeness: 0.95
    sensitivity: public
    status: active
    tags: [融合资产, 派生指标, 逐小时, 服务入口]
    primary_key: [city_id, time]
    time_column: time
    partition_keys: [city_id, year, month]
    columns:
      - {name: city_id, type: string, unit: "-", nullable: false, pk: true, desc: 城市标识}
      - {name: time, type: timestamp, unit: iso8601, nullable: false, pk: true, desc: 数据时间戳（城市本地时区整点）}
      - {name: temperature_2m, type: double, unit: °C, nullable: true, range: [-90, 60], desc: 2 米气温（上游：天气）}
      - {name: apparent_temperature, type: double, unit: °C, nullable: true, range: [-90, 70], desc: 体感温度（上游：天气）}
      - {name: relative_humidity_2m, type: double, unit: "%", nullable: true, range: [0, 100], desc: 相对湿度（上游：天气）}
      - {name: precipitation, type: double, unit: mm, nullable: true, range: [0, 500], desc: 降水量（上游：天气）}
      - {name: weather_code, type: integer, unit: wmo, nullable: true, desc: WMO 天气现象代码（上游：天气）}
      - {name: cloud_cover, type: double, unit: "%", nullable: true, range: [0, 100], desc: 云量（上游：天气）}
      - {name: pressure_msl, type: double, unit: hPa, nullable: true, range: [850, 1100], desc: 海平面气压（上游：天气）}
      - {name: wind_speed_10m, type: double, unit: km/h, nullable: true, range: [0, 400], desc: 10 米风速（上游：天气）}
      - {name: wind_direction_10m, type: double, unit: "°", nullable: true, range: [0, 360], desc: 10 米风向（上游：天气）}
      - {name: pm2_5, type: double, unit: μg/m³, nullable: true, range: [0, 2000], desc: PM2.5 浓度（上游：空气质量）}
      - {name: pm10, type: double, unit: μg/m³, nullable: true, range: [0, 3000], desc: PM10 浓度（上游：空气质量）}
      - {name: ozone, type: double, unit: μg/m³, nullable: true, range: [0, 1000], desc: 臭氧浓度（上游：空气质量）}
      - {name: nitrogen_dioxide, type: double, unit: μg/m³, nullable: true, range: [0, 2000], desc: 二氧化氮浓度（上游：空气质量）}
      - {name: sulphur_dioxide, type: double, unit: μg/m³, nullable: true, range: [0, 3000], desc: 二氧化硫浓度（上游：空气质量）}
      - {name: carbon_monoxide, type: double, unit: μg/m³, nullable: true, range: [0, 60000], desc: 一氧化碳浓度（上游：空气质量）}
      - {name: european_aqi, type: double, unit: EAQI, nullable: true, range: [0, 500], desc: 欧洲空气质量指数（上游：空气质量）}
      - {name: us_aqi, type: double, unit: USAQI, nullable: true, range: [0, 500], desc: 美国空气质量指数（上游：空气质量）}
      - {name: china_aqi, type: double, unit: AQI, nullable: true, range: [0, 500], is_derived: true, desc: "派生：国标 AQI（GB 3095-2012），PM 用 24 小时滑动平均、O₃ 用 8 小时滑动平均计算"}
      - {name: china_aqi_level, type: string, unit: "-", nullable: true, enum: [优, 良, 轻度污染, 中度污染, 重度污染, 严重污染], is_derived: true, desc: "派生：国标 AQI 等级（AQI≤50 优、≤100 良、≤150 轻度污染、≤200 中度污染、≤300 重度污染、>300 严重污染）"}
      - {name: china_primary_pollutant, type: string, unit: "-", nullable: true, enum: [PM2.5, PM10, O₃, NO₂, SO₂, CO, 无], is_derived: true, desc: "派生：国标口径首要污染物（IAQI 最大且超过 50 者，否则记「无」）"}
      - {name: aqi_level, type: string, unit: "-", nullable: true, enum: [优, 良, 轻度污染, 中度污染, 重度污染, 严重污染], desc: "派生：基于 european_aqi 的空气质量等级（中国 GB 3095 表述）"}
      - {name: primary_pollutant, type: string, unit: "-", nullable: true, enum: [PM2.5, PM10, O₃, NO₂, SO₂, CO, 无], desc: 派生：IAQI 最大的首要污染物}
      - {name: comfort_index, type: double, unit: index, nullable: true, range: [0, 100], desc: 派生：人体舒适度指数（温湿风综合）}
      - {name: ventilation_index, type: double, unit: index, nullable: true, range: [0, 10000], desc: 派生：通风扩散指数（风速×混合层近似），越低越易污染物累积}
      - {name: is_stagnant, type: integer, unit: "0/1", nullable: true, enum: [0, 1], desc: 派生：静稳天气标志（低风速且无降水）}
      - {name: is_forecast, type: integer, unit: "0/1", nullable: true, enum: [0, 1], desc: "实况/预报标志（来自天气资产）：1 为预报值，0 为实况分析值"}
      - {name: ingested_at, type: timestamp, unit: iso8601, nullable: true, desc: 平台入库时间}
      - {name: source_run_id, type: string, unit: "-", nullable: true, desc: 采集批次标识}

  # ----------------------------------------------------------
  # 7. 服务层：城市环境日汇总
  # ----------------------------------------------------------
  - key: atmos.city_environment.daily
